<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
  html,body{margin:0;height:100%;background:#0b0820;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:10px;box-shadow:0 0 60px #000a}
  /* ---- mando táctil (solo en móvil / tablet) ---- */
  html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #pad{display:none;position:fixed;inset:0;pointer-events:none;font-family:"Fredoka","Segoe UI",Arial,sans-serif}
  .touch #pad{display:block}
  .touch canvas{border-radius:0;box-shadow:none}
  .b{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
     border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);
     color:#fff;font-weight:700;text-shadow:0 2px 0 #2b1b3d;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .b.on{background:rgba(255,210,63,.55);transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.dir{width:60px;height:60px;font-size:26px;background:rgba(255,255,255,.12)}
  #bL{left:calc(env(safe-area-inset-left) + 6px);bottom:calc(env(safe-area-inset-bottom) + 64px)}
  #bR{left:calc(env(safe-area-inset-left) + 72px);bottom:calc(env(safe-area-inset-bottom) + 64px)}
  #bU{left:calc(env(safe-area-inset-left) + 39px);bottom:calc(env(safe-area-inset-bottom) + 122px)}
  #bD{left:calc(env(safe-area-inset-left) + 39px);bottom:calc(env(safe-area-inset-bottom) + 6px)}
  #bJ{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:104px;height:104px;font-size:19px;background:rgba(94,242,214,.30)}
  #bF{right:calc(env(safe-area-inset-right) + 134px);bottom:calc(env(safe-area-inset-bottom) + 12px);width:80px;height:80px;font-size:17px;background:rgba(255,120,80,.30)}
  .mini{top:calc(env(safe-area-inset-top) + 10px);width:46px;height:46px;font-size:20px}
  #bP{right:calc(env(safe-area-inset-right) + 12px)}
  #bM{right:calc(env(safe-area-inset-right) + 12px);top:calc(env(safe-area-inset-top) + 64px)}
  #rot{display:none;position:fixed;inset:0;background:#0b0820;color:#fff;font:600 24px "Fredoka",Arial,sans-serif;
       align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}
  @media (orientation:portrait){ .touch #rot{display:flex} }

<body>
<canvas id="c"></canvas>
<div id="pad">
  <div class="b dir" id="bU">▲</div>
  <div class="b dir" id="bL">◀</div>
  <div class="b dir" id="bR">▶</div>
  <div class="b dir" id="bD">▼</div>
  <div class="b" id="bF">DISPARO</div>
  <div class="b" id="bJ">SALTAR</div>
  <div class="b mini" id="bM">♪</div>
  <div class="b mini" id="bP">❚❚</div>
</div>
<div id="rot">📱↻<br><br>Gira el móvil para jugar</div>
<script>
// ============================================================
//  CAMBIA THINGS — monopatín → snowboard → nave espacial → ¡la Luna!
//  3 niveles: Luna, Marte y Saturno, cada uno un poco más difícil
//  Controles: ← → (y ↑ ↓ en la nave) para moverse
//             ESPACIO una vez = saltar
//             ESPACIO dos veces = disparar (una bola por pulsación)
//             snowboard: ↑ en el aire = voltereta · ↓ en el aire = agarrar la tabla
//             (X también dispara · P = pausa · M = música)
// ============================================================
const W = 960, H = 540, GY = H - 80;           // GY = altura del suelo
const TILT = 0.055;                            // inclinación de la cuesta en los niveles de suelo
const M = 80;                                  // margen que se pinta de más para que la inclinación no deje huecos
const OL = '#2b1b3d';                          // color de los contornos
const FONT = '"Fredoka","Segoe UI",Arial,sans-serif';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d', { alpha: false }), K = 1;
let kCap = 2;                                   // tope de resolución; baja solo si el ordenador no llega
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = window.devicePixelRatio || 1;
  K = Math.min(s * dpr, kCap);                  // resolución real de la pantalla: nada borroso
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

const EMO = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const hash = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;

// ---------------- utilidades de dibujo ----------------
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function ball(x, y, r, c1, c2, ol = true, lw = 2.5) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  circ(x, y, r); ctx.fillStyle = g; ctx.fill();
  if (ol) { ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.stroke(); }
}
function limb(pts, color, w, ol = true) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  if (ol) { ctx.strokeStyle = OL; ctx.lineWidth = w + 3.5; ctx.stroke(); }
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function fillOl(fill, lw = 2.5) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OL; ctx.stroke(); }
function star4(x, y, s, color, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function star5(x, y, r, fill, stroke = OL, lw = 2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function emoji(ch, x, y, size) { ctx.font = size + 'px ' + EMO; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y); }
function txt(s, x, y, size, o = {}) {
  const { fill = '#fff', fill2 = null, stroke = OL, align = 'center', shadow = true, weight = 700 } = o;
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (shadow) { ctx.strokeStyle = 'rgba(20,0,40,.35)'; ctx.lineWidth = size / 4; ctx.strokeText(s, x, y + size * 0.09); }
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill2 ? vgrad(y - size / 2, y + size / 2, [fill, fill2]) : fill; ctx.fillText(s, x, y);
  ctx.restore();
}
// letras de título con relieve 3D
function logo(s, x, y, size, c1, c2, side) {
  ctx.save(); ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = 'rgba(10,0,30,.35)'; ctx.strokeText(s, x + 4, y + 16);
  for (let d = 10; d >= 1; d--) { ctx.lineWidth = size / 6; ctx.strokeStyle = OL; ctx.strokeText(s, x, y + d); ctx.fillStyle = side; ctx.fillText(s, x, y + d); }
  ctx.lineWidth = size / 6; ctx.strokeStyle = OL; ctx.strokeText(s, x, y);
  ctx.fillStyle = vgrad(y - size / 2, y + size / 2, [c1, c2]); ctx.fillText(s, x, y);
  ctx.save(); ctx.beginPath(); ctx.rect(x - W, y - size, W * 2, size * 0.42); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillText(s, x, y); ctx.restore();
  ctx.restore();
}
// panel de cristal brillante (para el marcador y los carteles)
function glass(x, y, w, h, r = 16, a = 0.55) {
  ctx.save();
  rr(x, y + 3, w, h, r); ctx.fillStyle = 'rgba(10,0,30,.25)'; ctx.fill();
  rr(x, y, w, h, r); ctx.fillStyle = vgrad(y, y + h, [`rgba(60,40,130,${a})`, `rgba(20,10,55,${a + 0.2})`]); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke();
  ctx.clip(); ctx.fillStyle = vgrad(y, y + h * 0.5, ['rgba(255,255,255,.22)', 'rgba(255,255,255,0)']); ctx.fillRect(x, y, w, h * 0.5);
  ctx.restore();
}
function keycap(x, y, label, w = 44) {
  ctx.save();
  rr(x - w / 2, y - 16 + 5, w, 32, 8); ctx.fillStyle = '#7d7aa0'; ctx.fill();
  rr(x - w / 2, y - 16, w, 32, 8); ctx.fillStyle = vgrad(y - 16, y + 16, ['#ffffff', '#d9d6ee']); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = OL; ctx.stroke();
  ctx.font = `700 ${label.length > 2 ? 15 : 20}px ${FONT}`; ctx.fillStyle = OL; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y + 1);
  ctx.restore();
}
function rays(x, y, n, len, color, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len); g.addColorStop(0, color); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  for (let i = 0; i < n; i++) { const a = i * TAU / n; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, a, a + TAU / n / 2); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// dibuja una vez en un lienzo aparte (para fondos detallados sin gastar en cada fotograma)
function sprite(w, h, fn, S = 2) {
  const c = document.createElement('canvas'); c.width = w * S; c.height = h * S;
  const old = ctx; ctx = c.getContext('2d'); ctx.scale(S, S); fn(w, h); ctx = old;
  c.w = w; c.h = h; return c;
}

// ---------------- sonido ----------------
let AC = null;
function beep(f, d = 0.1, type = 'square', vol = 0.06, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
const notes = (list, gap, d = 0.15) => list.forEach((f, i) => setTimeout(() => beep(f, d, 'square', 0.05), i * gap));
const sfx = {
  jump: () => beep(320, 0.15, 'square', 0.05, 380),
  shoot: () => beep(900, 0.08, 'square', 0.03, -500),
  coin: () => notes([988, 1319], 70, 0.1),
  boom: () => beep(220, 0.25, 'sawtooth', 0.06, -160),
  hurt: () => beep(180, 0.45, 'triangle', 0.12, -120),
  change: () => notes([523, 659, 784, 1047, 784, 1047], 110),
  win: () => notes([523, 659, 784, 1047, 1319, 1568, 2093], 140, 0.25),
  over: () => notes([392, 330, 262, 196], 180, 0.25),
  trick: () => notes([784, 988, 1175, 1568], 55, 0.12),
  ramp: () => beep(260, 0.3, 'square', 0.05, 700),
};

// ---------------- música ----------------
// canciones de 8 bits hechas con notas: melodía (onda cuadrada), bajo (triangular) y un platillo de ruido.
// mel = una nota MIDI por corchea (null = silencio); chords = la nota del bajo de cada compás (8 corcheas)
const SONGS = {
  title: { bpm: 116, mel: [72, 76, 79, 76, 72, 76, 79, 84, 81, 77, 74, 77, 79, null, null, null,
                           72, 76, 79, 76, 72, 76, 79, 84, 83, 79, 74, 79, 72, null, null, null], chords: [48, 41, 48, 43] },
  skate: { bpm: 152, mel: [72, null, 76, 79, 76, null, 72, 74, 76, null, 79, 81, 79, 76, 74, null,
                           72, null, 76, 79, 84, null, 81, 79, 77, 76, 74, null, 72, null, null, null], chords: [48, 41, 43, 48] },
  snow:  { bpm: 138, mel: [79, null, 83, 86, 83, null, 79, 81, 83, null, 86, 88, 86, null, 83, null,
                           76, null, 79, 83, 81, null, 79, 76, 74, null, 76, 79, 79, null, null, null], chords: [43, 40, 48, 50] },
  ship:  { bpm: 164, mel: [69, 72, 76, 72, 69, 72, 76, 79, 77, 76, 74, 72, 74, null, 71, null,
                           69, 72, 76, 72, 69, 72, 76, 81, 79, 77, 76, 74, 76, null, null, null], chords: [45, 41, 43, 40] },
  win:   { bpm: 120, mel: [72, 76, 79, 84, null, 79, 84, null, 81, 84, 88, null, 86, 84, null, null,
                           77, 81, 84, 89, null, 84, 88, null, 86, 83, 79, 83, 84, null, null, null], chords: [48, 41, 43, 48] },
};
let music = { on: localStorage.getItem('cambiaThingsMusic') !== 'off', song: null, step: 0, next: 0, gain: null, noise: null };
const mfreq = n => 440 * Math.pow(2, (n - 69) / 12);
function mNote(f, t, d, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(music.gain); o.start(t); o.stop(t + d + 0.02);
}
function mHat(t) {
  if (!music.noise) { const b = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; music.noise = b; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = music.noise; f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.025, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  s.connect(f).connect(g).connect(music.gain); s.start(t); s.stop(t + 0.05);
}
function setSong(name) {
  if (!AC || music.song === name) return;
  music.song = name; music.step = 0; music.next = AC.currentTime + 0.05;
}
function musicTick() {
  if (!AC || !music.song) return;
  if (!music.gain) { music.gain = AC.createGain(); music.gain.connect(AC.destination); }
  music.gain.gain.value = music.on && !paused ? 0.9 : 0;
  const S = SONGS[music.song], step = 60 / S.bpm / 2;               // corcheas
  if (music.next < AC.currentTime - 0.2) music.next = AC.currentTime + 0.02;   // pestaña en segundo plano: no recuperar el retraso
  while (music.next < AC.currentTime + 0.12) {
    const i = music.step % S.mel.length, t = music.next, n = S.mel[i];
    if (music.on && !paused) {
      if (n) mNote(mfreq(n), t, step * 0.9, 'square', 0.022);
      const root = S.chords[Math.floor(i / 8) % S.chords.length];
      mNote(mfreq(i % 2 ? root + 7 : root), t, step * 0.85, 'triangle', 0.06);
      if (i % 2) mHat(t);
    }
    music.step++; music.next += step;
  }
}
setInterval(musicTick, 25);

// ---------------- niveles ----------------
// cada nivel es un viaje entero en 3 fases: monopatín → snowboard → nave espacial
const LEVELS = [
  { name: 'FASE 1', title: '¡Cuesta abajo en monopatín!', mode: 'ground', speed: 300, len: 35, every: [1.2, 2.0], enemies: ['skate', 'skate', 'cone', 'bird'],
    hint: 'Coge las burbujas: escudo · triple disparo · imán · vida extra' },
  { name: 'FASE 2', title: '¡Snowboard en la nieve!', mode: 'ground', speed: 370, len: 40, every: [1.4, 2.3], enemies: ['snowman', 'snowman', 'snowball'],
    hint: 'Rampas = ¡saltos gigantes!  ·  en el aire: ↑ voltereta, ↓ agarrar' },
  { name: 'FASE 3', title: '¡Nave espacial hacia {dest}!', mode: 'fly', speed: 420, len: 45, every: [0.6, 1.3], enemies: ['alien', 'alien', 'ufo'],
    hint: 'Flechas = volar  ·  ESPACIO = disparar', hintT: '◀ ▶ ▲ ▼ = volar  ·  DISPARO = disparar' },
];
// los 3 niveles: a dónde vas y lo difícil que es
const WORLDS = [
// fire = los enemigos disparan (0 no, 1 a veces, 2 mucho) · tough = los grandes aguantan 2 golpes · boss = vida de la nave nodriza del final
  { to: 'la Luna', name: 'LA LUNA', fast: 1, often: 0.85, fire: 0, tough: false, boss: 0, tint: null },
  { to: 'Marte', name: 'MARTE', fast: 1.1, often: 0.78, fire: 0.6, tough: false, boss: 10, tint: 'rgba(255,120,50,.16)' },       // atardecer
  { to: 'Saturno', name: 'SATURNO', fast: 1.32, often: 0.55, fire: 2, tough: true, boss: 24, tint: 'rgba(30,20,110,.30)' },    // de noche
];
let world = 0, CUR = null, ramps = [], spawnR = 0, ebul = [], boss = null, bossDone = false;

// ---------------- estado ----------------
let state = 'title', lvl = 0, T = 0, lives = 3, coins = 0, score = 0, coinsAtStart = 0, scoreAtStart = 0;
let best = +(localStorage.getItem('cambiaThingsBest') || 0);
let P = null, enemies = [], coinArr = [], shots = [], parts = [];
let scroll = 0, clock = 0, spawnE = 0, spawnC = 0, fireCd = 0, shake = 0, changeT = 0, landT = 0, winT = 0, paused = false;
let flash = 0, hitFlash = 0;
let spaceDown = 0; const keys = {};

// ---------------- potenciadores ----------------
const POWERS = {
  shield: { color: '#4cc9f0', label: '¡ESCUDO!', dur: 8 },
  multi:  { color: '#ff9f1c', label: '¡TRIPLE DISPARO!', dur: 10 },
  magnet: { color: '#c77dff', label: '¡IMÁN DE MONEDAS!', dur: 10 },
  life:   { color: '#ff3355', label: '¡VIDA EXTRA!' },
};
const MAX_LIVES = 5;
let pow = { shield: 0, multi: 0, magnet: 0 }, powArr = [], spawnP = 0, popups = [];
function resetPowers() { pow = { shield: 0, multi: 0, magnet: 0 }; }

function startLevel(i, keepPos = false) {
  lvl = i; const L = LEVELS[i], Wd = WORLDS[world];
  CUR = Object.assign({}, L, { speed: L.speed * Wd.fast, every: L.every.map(v => v * Wd.often) });
  T = -2.4; enemies = []; coinArr = []; shots = []; powArr = []; ramps = []; ebul = []; boss = null; bossDone = false;
  spawnE = 1.2; spawnC = 0.3; spawnP = rnd(4, 7); spawnR = 3; lives = Math.max(3, lives);
  coinsAtStart = coins; scoreAtStart = score;
  const old = P;
  P = { x: 150, y: L.mode === 'fly' ? H / 2 : GY - 35, vy: 0, vx: 0, onGround: L.mode !== 'fly', inv: 0, r: L.mode === 'fly' ? 24 : 26, rot: Math.PI / 4, sq: 0,
        spin: 0, turned: 0, grab: 0, onRamp: false };
  if (keepPos && old) { P.x = old.x; if (L.mode === 'fly') P.y = old.y; }
  state = 'play';
}
function newGame() { world = 0; armShown = 0; coins = 0; score = 0; lives = 0; resetPowers(); parts = []; startLevel(0); flash = 0.6; }
function nextWorld() { world++; resetPowers(); parts = []; popups = []; startLevel(0); flash = 0.8; }

// ---------------- controles ----------------
const GAME_KEYS = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
function keyDown(code) {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  keys[code] = true;
  if (code === 'KeyP' && state === 'play') paused = !paused;
  if (code === 'KeyM') { music.on = !music.on; localStorage.setItem('cambiaThingsMusic', music.on ? 'on' : 'off'); popup(music.on ? '♪ Música' : 'Música apagada', W / 2, 140, '#aef6ff', 26); }
  if (code === 'Space') onSpace();
  if (code === 'KeyX' && state === 'play' && !paused) shoot(true);
}
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keyDown(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------------- mando táctil (móvil y tablet) ----------------
// los botones hacen lo mismo que las teclas: ◀ ▶ ▲ ▼ = flechas · SALTAR = ESPACIO · DISPARO = X
let TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

if (TOUCH) useTouch();

function bigScreen() {                       // pantalla completa y en horizontal (Android; en iPhone se usa "Añadir a inicio")
  const d = document.documentElement;

}
const PAD = { bL: 'ArrowLeft', bR: 'ArrowRight', bU: 'ArrowUp', bD: 'ArrowDown', bJ: 'Space', bF: 'KeyX', bP: 'KeyP', bM: 'KeyM' };
for (const [id, code] of Object.entries(PAD)) {

  el.addEventListener('pointerdown', e => {

    if (!held.size) { el.classList.add('on'); keyDown(code); } held.add(e.pointerId);
  });
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
// en las pantallas de inicio / fin, tocar en cualquier sitio = ESPACIO
cv.addEventListener('pointerdown', e => {

});
addEventListener('contextmenu', e => { if (TOUCH) e.preventDefault(); });
const ACT = () => TOUCH ? 'Toca la pantalla' : 'Pulsa ESPACIO';

function onSpace() {
  if (state === 'title') return newGame();
  if (state === 'over') { coins = coinsAtStart; score = scoreAtStart; armShown = armLevel(); resetPowers(); return startLevel(lvl); }
  if (state === 'win') { if (winT > 1.5) { if (world < WORLDS.length - 1) nextWorld(); else { state = 'title'; parts = []; } } return; }
  if (state !== 'play' || paused) return;
  spaceDown = performance.now();
  const L = LEVELS[lvl];
  if (L.mode === 'ground' && P.onGround) {          // una pulsación en el suelo = salto
    P.vy = -880; P.onGround = false; sfx.jump();
    dust(P.x - 10, GY, 6);
  } else {
    shoot(true);                                     // segunda pulsación (en el aire) o cohete = disparo
  }
}
const SHOT_GY = GY - 22;   // altura a la que ruedan los disparos en el suelo
// una bola por pulsación (mantener pulsado no dispara más) y un pequeño descanso entre bolas
const FIRE_GAP = 0.25;
// ---------------- el arma evoluciona con las monedas ----------------
const ARMS = [
  { need: 0,   name: 'BOLA',          color: '#ffd23f' },
  { need: 40,  name: 'BOLA RÁPIDA',   color: '#4cc9f0' },     // dispara más seguido
  { need: 100, name: 'DOBLE BOLA',    color: '#7cf06a' },     // dos bolas a la vez
  { need: 180, name: 'SÚPER BOLA',    color: '#c77dff' },     // dos bolas que quitan 2 de vida
];
function armLevel() { let l = 0; ARMS.forEach((a, i) => { if (coins >= a.need) l = i; }); return l; }
let armShown = 0;
function checkArm() {
  const l = armLevel();
  if (l > armShown) {
    armShown = l; sfx.change(); flash = 0.4;
    popup('¡TU ARMA EVOLUCIONA! ' + ARMS[l].name, W / 2, 150, ARMS[l].color, 30);
    for (let i = 0; i < 16; i++) sparkle(P.x, P.y);
  }
}
function shoot() {
  if (fireCd > 0) return;
  const al = armLevel(), dmg = al >= 3 ? 2 : 1, big = al >= 3;
  fireCd = al >= 1 ? 0.17 : FIRE_GAP;
  const fly = LEVELS[lvl].mode === 'fly';
  if (fly) {
    const a = P.rot - Math.PI / 4, x = P.x + Math.cos(a) * 56, y = P.y + Math.sin(a) * 56;
    if (al >= 2) { shots.push({ x, y: y - 9, vx: 820, vy: 0, dmg, big }); shots.push({ x, y: y + 9, vx: 820, vy: 0, dmg, big }); }

    if (pow.multi > 0) { shots.push({ x, y, vx: 800, vy: -240 }); shots.push({ x, y, vx: 800, vy: 240 }); }
  } else {
    // aunque dispares saltando, la bola baja al suelo y sigue rodando: así le da a lo que va por el suelo
    const x = P.x + 26, y = P.y - 6;
    shots.push({ x, y, vx: 820, vy: Math.max(0, (SHOT_GY - y) / 0.22), roll: true, dmg, big });
    if (al >= 2) shots.push({ x: x - 30, y, vx: 820, vy: Math.max(0, (SHOT_GY - y) / 0.22), roll: true, dmg, big });

// ---------------- partículas ----------------
function addP(o) { const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 0.5, size: 4, color: '#fff', grav: 0, kind: 'dot', rot: 0, vr: 0, add: false, drag: 1 }, o); p.max = p.max || p.life; parts.push(p); }

  for (let i = 0; i < 4; i++) addP({ kind: 'smoke', x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-40, 40), vy: rnd(-60, -10), life: rnd(0.6, 0.9), size: rnd(10, 16), color: '#ffffff', drag: 0.95 });
}

}

  addP({ kind: 'star', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.9, size: rnd(6, 13), color: Math.random() < 0.5 ? '#fff6b0' : '#9ff3ff', add: true, drag: 0.96, vr: rnd(-4, 4) });
}

}

// ---------------- generar enemigos y monedas ----------------
function spawnEnemy(L, prog) {
  const type = L.enemies[(Math.random() * L.enemies.length) | 0], sp = L.speed;
  const e = { type, x: W + 60, ph: rnd(0, 6.28) };
  if (type === 'skate')    Object.assign(e, { y: GY - 14, y0: GY - 14, r: 20, vx: -(sp + rnd(60, 160 + prog * 120)) });
  if (type === 'snowman')  Object.assign(e, { y: GY - 34, y0: GY - 34, r: 28, vx: -sp });
  if (type === 'snowball') Object.assign(e, { y: GY - rnd(110, 170), r: 18, vx: -(sp + rnd(120, 200)) }), e.y0 = e.y;
  if (type === 'alien')    Object.assign(e, { y0: rnd(70, H - 70), r: 22, vx: -(sp * 0.55 + rnd(0, 120 + prog * 120)), amp: 40, f: 2.5 }), e.y = e.y0;
  if (type === 'ufo')      Object.assign(e, { y0: rnd(110, H - 110), r: 24, vx: -(sp + rnd(80, 200)), amp: 90, f: 3.5 }), e.y = e.y0;
  if (type === 'bird')     Object.assign(e, { y0: GY - rnd(125, 165), r: 18, vx: -(sp + rnd(80, 170)), amp: 12, f: 5 }), e.y = e.y0;   // paloma: ¡no saltes cuando pasa!
  if (type === 'cone')     Object.assign(e, { y: GY - 16, y0: GY - 16, r: 17, vx: -sp });                                         // cono: hay que saltarlo
  const Wd = WORLDS[world];
  e.hp = Wd.tough && (type === 'snowman' || type === 'ufo') ? 2 : 1;
  e.fireT = rnd(0.6, 1.8);
  enemies.push(e);
  // de vez en cuando, en los niveles difíciles, vienen de dos en dos
  if (world > 0 && L.mode === 'ground' && Math.random() < (world === 1 ? 0.12 : 0.3) && type !== 'bird') enemies.push(Object.assign({}, e, { x: e.x + 140, ph: rnd(0, 6.28) }));
  // a medida que avanza el nivel salen más
  spawnE = rnd(L.every[0], L.every[1]) * (1 - 0.45 * prog);
}
function spawnCoins(L) {
  if (L.mode === 'ground') {
    if (Math.random() < 0.5) for (let i = 0; i < 5; i++) coinArr.push({ x: W + 30 + i * 40, y: GY - 35 });
    else for (let i = 0; i < 5; i++) coinArr.push({ x: W + 30 + i * 45, y: GY - 60 - Math.sin(i / 4 * Math.PI) * 120 });
  } else {
    const y0 = rnd(80, H - 80), wave = Math.random() < 0.5;
    for (let i = 0; i < 6; i++) coinArr.push({ x: W + 30 + i * 40, y: clamp(y0 + (wave ? Math.sin(i) * 45 : 0), 40, H - 40) });
  }
  spawnC = rnd(1.0, 1.9);
}
function spawnPower(L) {
  const opts = ['shield', 'shield', 'multi', 'multi', 'multi', 'magnet', 'magnet'];
  if (lives < MAX_LIVES) opts.push('life', 'life');
  const type = opts[(Math.random() * opts.length) | 0];
  const y = L.mode === 'ground' ? (Math.random() < 0.5 ? GY - 45 : GY - 130) : rnd(80, H - 80);
  powArr.push({ type, x: W + 40, y0: y, y, ph: rnd(0, 6.28) });
  spawnP = rnd(6, 9) * (1 + 0.3 * world);      // en los niveles difíciles hay menos ayudas
}
function popup(txt_, x, y, color = '#fff', size = 30) { popups.push({ txt: txt_, x, y, color, size, life: size > 24 ? 1.4 : 0.8 }); }
function collectPower(p) {
  const d = POWERS[p.type];
  if (p.type === 'life') lives = Math.min(MAX_LIVES, lives + 1); else pow[p.type] = d.dur;
  popup(d.label, P.x + 40, P.y - 70, d.color);
  burst(p.x, p.y, d.color); for (let i = 0; i < 10; i++) sparkle(p.x, p.y);
  notes([660, 880, 1100, 1320], 60, 0.12);
}

function hurt() {
  if (P.inv > 0 || pow.shield > 0) return;
  lives--; P.inv = 2; shake = 12; hitFlash = 1; sfx.hurt();
  burst(P.x, P.y, '#ff4d6d');
  if (lives <= 0) { state = 'over'; sfx.over(); }
}
const ENEMY_COLOR = { skate: '#9d4edd', snowman: '#ffffff', snowball: '#cfe8ff', alien: '#8ee34d', ufo: '#b9c2dd', bird: '#b8bfd6', cone: '#ff7b25' };
function kill(e, i) {
  enemies.splice(i, 1); score += 10; sfx.boom(); shake = Math.max(shake, 4);
  burst(e.x, e.y, ENEMY_COLOR[e.type]);
  popup('+10', e.x, e.y - 30, '#ffe066', 22);
}

// ---------------- actualizar ----------------
function update(dt) {
  clock += dt; shake = Math.max(0, shake - 40 * dt);
  flash = Math.max(0, flash - dt * 2.5); hitFlash = Math.max(0, hitFlash - dt * 3);
  if (state === 'title') { scroll += 220 * dt; if (Math.random() < dt * 6) addP({ kind: 'streak', x: W + M, y: rnd(GY - 140, GY - 10), vx: -900, life: 1.4, size: rnd(40, 90) }); updParts(dt); return; }
  if (paused || state === 'over') return;
  updParts(dt);
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].y -= 40 * dt; popups[i].life -= dt; if (popups[i].life <= 0) popups.splice(i, 1); }
  const L = CUR;

  if (state === 'win') { winT += dt; if (Math.random() < 0.5) confetti(); return; }

  if (state === 'change') {
    const before = changeT; changeT -= dt; scroll += L.speed * 0.4 * dt;
    if (P.y < GY - 35 && L.mode === 'ground') P.y = Math.min(GY - 35, P.y + 300 * dt);
    if (Math.random() < 0.8) sparkle(P.x, P.y - 10);
    if (before > 1.3 && changeT <= 1.3) { flash = 1; burst(P.x, P.y - 10, '#ffe066', 2); }
    if (changeT <= 0) { startLevel(lvl + 1, true); flash = 0.7; }
    return;
  }

  if (state === 'landing') {
    landT += dt; scroll += L.speed * Math.max(0, 1 - landT) * dt;
    const tx = W - 170, ty = H / 2 + 20 - 140 - 34, k = Math.min(1, dt * 2);
    P.x += (tx - P.x) * k; P.y += (ty - P.y) * k; P.rot = lerp(P.rot, -Math.PI / 4, k);
    rocketExhaust(0.5);
    if (landT > 2.6) { state = 'win'; winT = 0; flash = 0.8; sfx.win(); if (score + coins * 5 > best) { best = score + coins * 5; localStorage.setItem('cambiaThingsBest', best); } }
    return;
  }

  // ---- jugando ----
  T += dt; scroll += L.speed * dt; fireCd -= dt; P.inv = Math.max(0, P.inv - dt); P.sq = Math.max(0, P.sq - dt * 5);
  for (const k in pow) pow[k] = Math.max(0, pow[k] - dt);
  const prog = clamp(T / L.len, 0, 1);
  const left = keys.ArrowLeft, right = keys.ArrowRight;
  if (L.mode === 'ground') {
    P.x = clamp(P.x + ((right ? 1 : 0) - (left ? 1 : 0)) * 330 * dt, 50, W * 0.6);
    // rampas (snowboard): el suelo sube; al salir por el borde, ¡salto gigante!
    const rh = rampHeightAt(P.x), floor = GY - 35 - rh;
    if (P.onRamp && rh === 0 && P.onGround) {
      P.onRamp = false; P.onGround = false; P.vy = -1080; P.y -= 2; sfx.ramp();
      popup('¡RAMPA!', P.x + 40, P.y - 80, '#9ff3ff', 28); for (let i = 0; i < 8; i++) sparkle(P.x, P.y + 10);
    }
    if (P.onGround && rh > 0) { P.y = floor; P.onRamp = true; }
    if (!P.onGround) {
      // piruetas en el aire: ↑ voltereta hacia atrás, ↓ agarrar la tabla
      if (lvl === 1 && keys.ArrowUp) { const d = 11 * dt; P.spin -= d; P.turned += d; if (Math.random() < 0.6) sparkle(P.x, P.y); }
      if (lvl === 1 && keys.ArrowDown) P.grab += dt;
      P.vy += 2200 * dt; P.y += P.vy * dt;
    }
    if (P.y >= floor && !P.onGround) { land(); P.y = floor; P.vy = 0; P.onGround = true; P.onRamp = rh > 0; }
    if (P.onGround && lvl === 1 && Math.random() < 0.7) addP({ kind: 'dot', x: P.x - 30, y: GY - 4, vx: rnd(-220, -90), vy: rnd(-160, -40), life: 0.45, size: rnd(1.5, 3.5), color: '#ffffff', grav: 500 });
    if (P.onGround && lvl === 0 && Math.random() < 0.15) addP({ kind: 'dot', x: P.x - 18, y: GY - 1, vx: rnd(-200, -80), vy: rnd(-90, -20), life: 0.25, size: 1.6, color: '#ffd166', add: true, grav: 400 });
    if (Math.random() < dt * 5) addP({ kind: 'streak', x: W + M, y: rnd(GY - 150, GY - 10), vx: -L.speed * 2.8, life: 1.2, size: rnd(40, 100) });
  } else {
    const up = keys.ArrowUp, down = keys.ArrowDown;
    const vy = ((down ? 1 : 0) - (up ? 1 : 0)) * 360;
    P.x = clamp(P.x + ((right ? 1 : 0) - (left ? 1 : 0)) * 360 * dt, 60, W - 260);
    P.y = clamp(P.y + vy * dt, 40, H - 40);
    P.rot = lerp(P.rot, Math.PI / 4 + vy / 360 * 0.3, Math.min(1, dt * 8));
    rocketExhaust(1);
    if (Math.random() < dt * 8) addP({ kind: 'streak', x: W + M, y: rnd(20, H - 20), vx: -L.speed * 3, life: 1, size: rnd(30, 80) });
  }
  if (T > 0 && T < L.len - 2) {
    spawnE -= dt; spawnC -= dt; spawnP -= dt; spawnR -= dt;
    // nada de enemigos justo detrás de una rampa: el salto tiene que poder aterrizar
    const rampNear = ramps.some(r => r.x > W - 420);
    if (spawnE <= 0 && !rampNear) spawnEnemy(L, prog);
    if (spawnC <= 0) spawnCoins(L);
    if (spawnP <= 0) spawnPower(L);
    if (lvl === 1 && spawnR <= 0 && !enemies.some(e => e.x > W - 260)) { ramps.push({ x: W + 40 }); spawnR = rnd(4.5, 6.5);
      // monedas en el aire, justo en la curva del salto
      for (let i = 0; i < 6; i++) { const d = 70 + i * 70, t = d / L.speed;
        coinArr.push({ x: W + 40 + RAMP_W + d, y: GY - 35 - RAMP_H - (1080 * t - 1100 * t * t) - 8 }); } }
  }
  for (let i = ramps.length - 1; i >= 0; i--) { ramps[i].x -= L.speed * dt; if (ramps[i].x < -RAMP_W - 60) ramps.splice(i, 1); }

  // centro del cuerpo para chocar (en el suelo el niño es más alto que ancho)
  const cy = L.mode === 'ground' ? P.y - 8 : P.y;

  for (let i = powArr.length - 1; i >= 0; i--) { const p = powArr[i];
    p.x -= L.speed * 0.8 * dt; p.y = p.y0 + Math.sin(clock * 3 + p.ph) * 8;
    if (p.x < -40) { powArr.splice(i, 1); continue; }
    if (Math.hypot(p.x - P.x, p.y - cy) < P.r + 24) { powArr.splice(i, 1); collectPower(p); } }

  for (let i = shots.length - 1; i >= 0; i--) { const s = shots[i]; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.roll && s.y >= SHOT_GY) { s.y = SHOT_GY; s.vy = 0; }
    if (s.x > W + 20 || s.y < -20 || s.y > H + 20) { shots.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) { const e = enemies[j];
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.r + 8) { shots.splice(i, 1);
        e.hp -= s.dmg || 1;
        if (e.hp > 0) { e.hit = 0.15; sfx.boom(); addP({ kind: 'ring', x: e.x, y: e.y, size: 8, grow: 30, life: 0.25, color: '#fff', add: true }); } else kill(e, j);
        break; } }
    if (boss && shots[i] === s && Math.hypot(boss.x - s.x, boss.y - s.y) < 74) { shots.splice(i, 1); hitBoss(s); } }

  for (let i = enemies.length - 1; i >= 0; i--) { const e = enemies[i];
    e.x += e.vx * dt;
    if (e.amp) e.y = e.y0 + Math.sin(clock * e.f + e.ph) * e.amp;
    if (e.type === 'skate') e.y = e.y0 - Math.abs(Math.sin(clock * 9 + e.ph)) * 5;
    e.hit = Math.max(0, (e.hit || 0) - dt);
    if (e.x < -80) { enemies.splice(i, 1); continue; }
    enemyAttack(e, L, dt);
    if (Math.hypot(e.x - P.x, e.y - cy) < e.r + P.r - 4) {
      // con escudo lo rompes; en el suelo, si caes encima, lo aplastas
      if (pow.shield > 0) kill(e, i);
      else if (L.mode === 'ground' && P.vy > 0 && P.y < e.y - e.r * 0.3) { kill(e, i); P.vy = -620; P.sq = 1; sfx.jump(); }
      else hurt();
      if (state !== 'play') return;
    }
  }
  for (let i = coinArr.length - 1; i >= 0; i--) { const c = coinArr[i]; c.x -= L.speed * dt;
    if (pow.magnet > 0) { const dx = P.x - c.x, dy = cy - c.y, d = Math.hypot(dx, dy);
      if (d < 280 && d > 1) { c.x += dx / d * 700 * dt; c.y += dy / d * 700 * dt; } }
    if (c.x < -30) { coinArr.splice(i, 1); continue; }
    if (Math.hypot(c.x - P.x, c.y - cy) < P.r + 14) { coinArr.splice(i, 1); coins++; sfx.coin(); checkArm();
      addP({ kind: 'ring', x: c.x, y: c.y, size: 6, grow: 22, life: 0.25, color: '#ffe066', add: true });
      for (let k = 0; k < 4; k++) sparkle(c.x, c.y); } }

  updEnemyShots(dt, cy);
  if (state !== 'play') return;
  if (boss) { updBoss(dt, L, cy); if (state !== 'play') return; }
  if (T >= L.len && L.mode === 'fly' && WORLDS[world].boss && !bossDone) {
    // fin de la fase 3 en Marte y Saturno: ¡aparece la nave nodriza!
    if (!boss) { enemies.forEach(e => burst(e.x, e.y, ENEMY_COLOR[e.type])); enemies = [];
      boss = { x: W + 160, y: H / 2, hp: WORLDS[world].boss, max: WORLDS[world].boss, t: 0, fire: 1.5, hit: 0 };
      popup('¡CUIDADO! ¡LA NAVE NODRIZA!', W / 2, H / 2 - 120, '#ff8a9c', 36); shake = 10; sfx.over(); }

  const done = state === 'win' || state === 'landing' ? 1 : (lvl + (state === 'change' ? 1 : clamp(T / LEVELS[lvl].len, 0, 1))) / 3;
  glass(bx - 30, 12, bw + 60, 46, 23);
  rr(bx, by - 5, bw, 10, 5); ctx.fillStyle = 'rgba(0,0,20,.45)'; ctx.fill();
  if (done > 0.01) { rr(bx, by - 5, bw * done, 10, 5); ctx.fillStyle = vgrad(by - 5, by + 5, ['#ffe066', '#ff9f1c']); ctx.fill(); }
  ctx.save(); ctx.translate(bx, by - 2); ctx.scale(0.42, 0.42); drawSkate(0, 0); ctx.restore();
  ctx.save(); ctx.translate(bx + bw / 3, by - 2); ctx.scale(0.36, 0.36); drawSnowboard(0, 0); ctx.restore();
  ctx.save(); ctx.translate(bx + bw * 2 / 3, by); ctx.scale(0.3, 0.3); drawRocket(-0.5, false); ctx.restore();
  ball(bx + bw, by, 10, DEST_COL[world][0], DEST_COL[world][2]);
  txt('NIVEL ' + (world + 1), bx + bw / 2, 66, 15, { fill: '#fff3a0', shadow: false, weight: 600 });
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; circ(bx + bw * done, by, 12); ctx.fillStyle = 'rgba(255,240,150,.4)'; ctx.fill(); ctx.restore();
  ball(bx + bw * done, by, 6.5, '#ffffff', '#ffd23f', true, 2);
  // potenciadores activos con su tiempo
  let px = 12;
  for (const k of ['shield', 'multi', 'magnet']) if (pow[k] > 0) {
    glass(px, 64, 96, 36, 14);
    drawPowerIcon(k, px + 20, 82, 0.62, false);
    rr(px + 40, 77, 46, 9, 4.5); ctx.fillStyle = 'rgba(0,0,20,.45)'; ctx.fill();
    rr(px + 40, 77, Math.max(4, 46 * pow[k] / POWERS[k].dur), 9, 4.5); ctx.fillStyle = POWERS[k].color; ctx.fill();
    px += 102;
  }
  ctx.restore();
}

// el marcador solo se vuelve a pintar cuando cambia algo de lo que enseña
let hudCv = null, hudKey = '';
function drawHUDCached() {
  const done = state === 'win' || state === 'landing' ? 1 : (lvl + (state === 'change' ? 1 : clamp(T / LEVELS[lvl].len, 0, 1))) / 3;
  const key = [K, world, lives, coins, score, Math.round(done * 300), Math.ceil(pow.shield * 6), Math.ceil(pow.multi * 6), Math.ceil(pow.magnet * 6)].join();
  if (!hudCv || hudCv.width !== Math.round(W * K)) { hudCv = document.createElement('canvas'); hudCv.width = Math.round(W * K); hudCv.height = Math.round(110 * K); hudKey = ''; }
  if (key !== hudKey) {
    const old = ctx; ctx = hudCv.getContext('2d'); ctx.setTransform(K, 0, 0, K, 0, 0); ctx.clearRect(0, 0, W, 110);
    drawHUD(); ctx = old; hudKey = key;
  }
  ctx.drawImage(hudCv, 0, 0, W, 110);
}

// ---------------- dibujar ----------------
function draw() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  const li = state === 'title' ? 0 : lvl, L = LEVELS[li];
  const tilt = L.mode === 'ground' ? TILT : 0;
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  ctx.translate(W / 2, H / 2); ctx.rotate(tilt); ctx.translate(-W / 2, -H / 2);
  drawBg(li);
  // cada nivel tiene su luz: de día, al atardecer (Marte) y de noche (Saturno)
  if (state !== 'title' && L.mode === 'ground' && WORLDS[world].tint) fillAll(WORLDS[world].tint);

  if (state === 'title') {
    const jump = Math.max(0, Math.sin(clock * 2.2)) ** 0.8 * 70;
    groundShadow(120, 30, jump);
    drawParts(false);
    drawPlayer(0, 120, GY - 35 - jump * 1.2, 0, 1.4, jump > 2);
    drawFront(0);
    drawParts(true);
  } else {
    if (L.mode === 'ground') {
      ramps.forEach(r => drawRamp(r.x));
      enemies.forEach(e => { if (e.type !== 'snowball' && e.type !== 'bird') groundShadow(e.x, e.type === 'snowman' ? 24 : 26); });
      if (state === 'play' || state === 'change') groundShadow(P.x, 30, GY - 35 - P.y);
    }
    coinArr.forEach(c => drawCoin(c.x, c.y));
    powArr.forEach(p => drawPowerIcon(p.type, p.x, p.y, 1 + Math.sin(clock * 6) * 0.06));
    drawParts(false);
    enemies.forEach(drawEnemy);
    if (boss) drawBoss();
    drawShots();
    drawEnemyShots();
    if (state === 'win') { const m = moonPos(); drawFlag(m.x + 46, m.y - m.R + 6); rays(m.x, m.y - m.R, 16, 320, 'rgba(255,240,180,.12)', clock * 0.2); }
    if (state === 'change') {
      const t = 2.6 - changeT, form = t < 1.3 ? lvl : lvl + 1;
      rays(P.x, P.y - 10, 12, 220, 'rgba(255,240,170,.25)', clock * 1.5);
      drawPlayer(form, P.x, P.y, t * 12, 1 + Math.sin(t * 6) * 0.25, false);
    } else if (!(P.inv > 0 && Math.floor(P.inv * 12) % 2)) {
      drawPlayer(lvl, P.x, P.y, lvl === 2 ? P.rot : P.spin, 1, L.mode === 'ground' && !P.onGround);
    }
    if (pow.shield > 0 && (state === 'play' || state === 'change')) drawShield();
    drawFront(li);
    drawParts(true);
    popups.forEach(p => { ctx.globalAlpha = clamp(p.life / 0.4, 0, 1); txt(p.txt, clamp(p.x, 170, W - 170), p.y, p.size, { fill: '#fff', fill2: p.color }); });
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.drawImage(VIGNETTE, 0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  if (hitFlash > 0) { ctx.fillStyle = `rgba(255,40,80,${hitFlash * 0.3})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'title') return drawTitle();
  drawHUDCached();
  const CL = LEVELS[lvl];
  if (state === 'play' && T < 0) {
    const a = clamp(-T / 0.4, 0, 1), sl = clamp((T + 2.4) / 0.3, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 3);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(0.7 + 0.3 * sl, 0.7 + 0.3 * sl);
    glass(-330, -100, 660, 200, 28, 0.6);
    txt('NIVEL ' + (world + 1) + '  ·  ' + CL.name, 0, -50, 50, { fill: '#fff3a0', fill2: '#ff9f1c' });
    txt(CL.title.replace('{dest}', WORLDS[world].to), 0, 10, 38);
    txt(world > 0 && lvl === 2 ? (TOUCH ? '◀ ▶ ▲ ▼ = volar · DISPARO · ¡al final, la nave nodriza!' : 'Flechas = volar · ESPACIO = disparar · ¡al final, la nave nodriza!') : world > 0 && lvl === 0 ? 'Palomas, conos y monopatines... ¡y vienen de dos en dos!' : (TOUCH && CL.hintT ? CL.hintT : CL.hint), 0, 62, 20, { fill: '#aef6ff', stroke: null, shadow: false, weight: 600 });
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (state === 'change') { const s = 1 + Math.sin(clock * 12) * 0.06; ctx.save(); ctx.translate(W / 2, H / 2 - 70); ctx.scale(s, s); logo('¡CAMBIA!', 0, 0, 92, '#fff3a0', '#ff9f1c', '#c2410c'); ctx.restore(); }
  if (paused) { glass(W / 2 - 200, H / 2 - 70, 400, 140, 26, 0.65); txt('PAUSA', W / 2, H / 2 - 15, 60, { fill: '#fff', fill2: '#bcd0ff' }); txt(TOUCH ? 'Toca ❚❚ para seguir' : 'Pulsa P para seguir', W / 2, H / 2 + 38, 22, { stroke: null, shadow: false, weight: 600 }); }
  if (state === 'over') {
    glass(W / 2 - 330, H / 2 - 120, 660, 240, 28, 0.65);
    emoji('😵', W / 2, H / 2 - 66, 64);
    txt('¡Uy! Sin vidas', W / 2, H / 2 + 8, 54, { fill: '#ff8a9c', fill2: '#e0103a' });
    txt((TOUCH ? 'Toca = probar otra vez la ' : 'ESPACIO = probar otra vez la ') + CL.name.toLowerCase(), W / 2, H / 2 + 74, 26, { fill: '#aef6ff', fill2: '#4cc9f0' });
  }
  if (state === 'win') {
    const s = clamp(winT * 3, 0, 1);
    ctx.save(); ctx.translate(W / 2 - 60, H / 2); ctx.scale(s, s);
    glass(-310, -135, 620, 270, 28, 0.65);
    logo('¡LLEGASTE A ' + WORLDS[world].name + '!', 0, -82, 46, '#fff3a0', '#ff9f1c', '#c2410c');
    drawCoin(-150, -6, 16, false); txt('x ' + coins, -95, -4, 36);
    star5(70, -6, 17, vgrad(-23, 11, ['#fff3a0', '#ffb703']), OL, 2.4); txt(String(score), 130, -4, 36);
    const tot = score + coins * 5;
    txt('Total: ' + tot + (tot >= best ? '   ¡RÉCORD!' : ''), 0, 52, 32, { fill: '#aef6ff', fill2: '#4cc9f0' });
    if (winT > 1.5) txt(world < WORLDS.length - 1 ? ACT() + ' para el NIVEL ' + (world + 2) + ': ¡a ' + WORLDS[world + 1].to + '!'
                              : '¡Has ganado los 3 niveles! ' + ACT() + ' para volver a jugar', 0, 102, 22, { stroke: null, shadow: false, weight: 600 });
    ctx.restore();
  }
}
function drawTitle() {
  const bob = Math.sin(clock * 3) * 6;
  logo('CAMBIA', W / 2, 92 + bob, 104, '#fff3a0', '#ff9f1c', '#c2410c');
  logo('THINGS', W / 2, 182 + bob, 104, '#ff9cb0', '#e0103a', '#8f0a2a');
  glass(W / 2 - 300, 248, 600, 112, 24, 0.55);
  if (TOUCH) {
    txt('◀ ▶  moverse      SALTAR  =  saltar', W / 2, 283, 24, { stroke: null, shadow: false, weight: 600 });
    txt('SALTAR en el aire o DISPARO  =  ¡disparar!', W / 2, 331, 24, { stroke: null, shadow: false, weight: 600 });
  } else {
  keycap(W / 2 - 252, 282, '←'); keycap(W / 2 - 204, 282, '→');
  txt('moverse', W / 2 - 170, 283, 22, { align: 'left', stroke: null, shadow: false, weight: 600 });
  keycap(W / 2 + 60, 282, 'ESPACIO', 96);
  txt('saltar', W / 2 + 120, 283, 22, { align: 'left', stroke: null, shadow: false, weight: 600 });
  keycap(W / 2 - 220, 330, 'ESPACIO', 96);
  txt('dos veces  =  ¡disparar!', W / 2 - 160, 331, 22, { align: 'left', stroke: null, shadow: false, weight: 600 });
  keycap(W / 2 + 196, 330, 'X');
  txt('dispara', W / 2 + 226, 331, 18, { align: 'left', stroke: null, shadow: false, weight: 500 });
  }
  if (best) txt('Récord: ' + best, W / 2, 228, 20, { fill: '#fff3a0', stroke: OL, shadow: false, weight: 600 });
  txt('3 niveles: la Luna · Marte · Saturno     ↑ en el aire = ¡voltereta!     ' + (TOUCH ? '♪ = música' : 'M = música'), W / 2, 392, 18, { fill: '#ffffff', stroke: OL, shadow: false, weight: 600 });
  const p = 1 + Math.sin(clock * 5) * 0.05;
  ctx.save(); ctx.translate(W / 2, 505); ctx.scale(p, p);
  rr(-200, -24, 400, 48, 24); ctx.fillStyle = vgrad(-24, 24, ['#5ef2d6', '#16a589']); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke();
  rr(-192, -20, 384, 18, 12); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
  txt(ACT() + ' para empezar', 0, 1, 26, { shadow: false });
  ctx.restore();
}

// atajo para probar: CambiaThings.html#nivel2 empieza en el nivel 2
// y CambiaThings.html#mundo3nivel3 = la nave del nivel 3 (Saturno)
const mw = location.hash.match(/mundo(\d)/); if (mw) world = clamp(+mw[1] - 1, 0, 2);
const m = location.hash.match(/nivel(\d)/);
if (m) { coins = 0; score = 0; startLevel(clamp(+m[1] - 1, 0, 2)); T = 5;
  if (location.hash.includes('rampaver')) { ramps.push({ x: P.x + 160 }); T = 0.5; }
  else if (location.hash.includes('rampa')) { ramps.push({ x: P.x - 60 }); P.y = GY - 35 - rampHeightAt(P.x); }
  if (location.hash.includes('truco')) { P.onGround = false; P.y = GY - 260; P.spin = -2.2; P.turned = 2.2; keys.ArrowUp = true; }
  if (location.hash.includes('agarre')) { P.onGround = false; P.y = GY - 220; P.grab = 1; keys.ArrowDown = true; }
  if (location.hash.includes('win')) { state = 'win'; winT = 2; }
  if (location.hash.includes('jefe')) { T = CUR.len; P.inv = 99; }
  if (location.hash.includes('vidas')) lives = 99;
  const mc = location.hash.match(/monedas(\d+)/); if (mc) { coins = +mc[1]; armShown = armLevel(); if (location.hash.includes('disparo')) for (let k = 0; k < 3; k++) { fireCd = 0; shoot(); shots.forEach(s => s.x += 120 * k); } }
  if (location.hash.includes('demo')) { const L = LEVELS[lvl]; for (let i = 0; i < 4; i++) { spawnEnemy(L, 0.5); enemies[i].x = 380 + i * 150; } spawnCoins(L); coinArr.forEach(c => c.x -= 500);
    ['shield', 'multi', 'magnet', 'life'].forEach((t, i) => powArr.push({ type: t, x: 300 + i * 140, y0: 200, y: 200, ph: 0 }));
    if (location.hash.includes('pow')) { pow.shield = 8; pow.multi = 6; pow.magnet = 3; P.inv = 99; fireCd = 0; shoot(true); } } }

// medición de rendimiento: CambiaThings.html#bench
if (location.hash.includes('bench')) {
  const out = [], Ks = [1, 2];
  for (const k of Ks) for (let l = 0; l < 3; l++) {
    K = k; cv.width = W * k; cv.height = H * k;
    coins = 0; score = 0; startLevel(l); T = 5; P.inv = 9999; resetPowers(); pow.shield = 9999;
    for (let f = 0; f < 240; f++) { update(1 / 60); if (f % 20 === 0) { fireCd = 0; shoot(); } }
    const t0 = performance.now(); for (let f = 0; f < 60; f++) draw(); ctx.getImageData(0, 0, 1, 1);
    const t1 = performance.now(); for (let f = 0; f < 60; f++) { ctx.setTransform(K, 0, 0, K, 0, 0); drawBg(l); } ctx.getImageData(0, 0, 1, 1);
    const t2 = performance.now();
    const tm = fn => { const a = performance.now(); for (let f = 0; f < 60; f++) { ctx.setTransform(K, 0, 0, K, 0, 0); fn(); } ctx.getImageData(0, 0, 1, 1); return ((performance.now() - a) / 60).toFixed(1); };
    const hud = tm(drawHUDCached), vig = tm(() => ctx.drawImage(VIGNETTE, 0, 0, W, H)), pl = tm(() => drawPlayer(lvl, P.x, P.y, P.rot, 1, false)),
      en = tm(() => enemies.forEach(drawEnemy)), co = tm(() => { coinArr.forEach(c => drawCoin(c.x, c.y)); powArr.forEach(q => drawPowerIcon(q.type, q.x, q.y)); }),
      pa = tm(() => { drawParts(false); drawParts(true); }), fr = tm(() => drawFront(l)), sh = tm(drawShots), shl = tm(drawShield);
    out.push(`   hud ${hud} vig ${vig} jug ${pl} malos ${en}(${enemies.length}) mon ${co}(${coinArr.length}) part ${pa} frente ${fr} disp ${sh}(${shots.length}) escudo ${shl}`);
    out.push(`K=${k} nivel${l + 1}: total ${((t1 - t0) / 60).toFixed(1)} ms · fondo ${((t2 - t1) / 60).toFixed(1)} ms · partículas ${parts.length}`);
  }
  window.BENCH = out;
  state = 'title'; fit();
}

let last = performance.now();
// si el ordenador no llega a 60 imágenes por segundo, baja un poco la resolución (nunca la sube)
let frameAvg = 1 / 60, lastDrop = 0;
function adaptQuality(dt, now) {
  frameAvg = frameAvg * 0.95 + dt * 0.05;
  if (frameAvg > 0.0195 && now - lastDrop > 1500 && K > 1) { kCap = Math.max(1, K * 0.8); fit(); lastDrop = now; frameAvg = 1 / 60; }
}
// qué canción suena según lo que esté pasando
function pickSong() { setSong(state === 'title' ? 'title' : state === 'win' ? 'win' : ['skate', 'snow', 'ship'][state === 'landing' ? 2 : lvl]); }
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; pickSong(); if (!window.BENCH) adaptQuality(dt, now); update(dt); draw(); if (window.BENCH) { ctx.setTransform(K, 0, 0, K, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '20px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; BENCH.forEach((s, i) => ctx.fillText(s, 20, 20 + i * 30)); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
